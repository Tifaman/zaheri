services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: zaheri
    ports:
      - "5432:5432"
    volumes:
      - zaheri_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - zaheri_redis_data:/data

volumes:
  zaheri_postgres_data:
  zaheri_redis_data:
