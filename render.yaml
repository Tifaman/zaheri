# Render Blueprint — deploys ZaHeri as three linked services: the NestJS
# API (Docker), a managed Postgres database, a managed Redis-compatible
# Key Value store, and the React PWA as a static site.
#
# CAVEATS (read before relying on this for anything but a demo):
# - Free Postgres expires after 30 days (+14-day grace) unless upgraded to
#   a paid plan — this is a Render limitation, not a ZaHeri one.
# - The free web service (zaheri-api) spins down after ~15 min idle; the
#   next request pays a ~30-60s cold-start cost. Static sites (zaheri-web)
#   don't have this problem.
# - CORS_ORIGIN/VITE_API_BASE_URL below assume the service names are free
#   on Render's shared onrender.com subdomain. If Render assigns different
#   URLs (name collision), update both values in the dashboard and
#   redeploy zaheri-web.

databases:
  - name: zaheri-postgres
    plan: free
    region: oregon
    postgresMajorVersion: '16'

services:
  - type: keyvalue
    name: zaheri-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all (internal use only — no public port is exposed)

  - type: web
    name: zaheri-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    # Runs against the live DB right before traffic switches to the new
    # deploy. Seed is upsert-based (safe to rerun) — it's what creates the
    # demo clinician@zaheri.dev / admin@zaheri.dev logins so the console
    # and analytics dashboard are actually reachable after a fresh deploy.
    preDeployCommand: pnpm --filter @zaheri/api exec prisma migrate deploy && pnpm --filter @zaheri/api run seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zaheri-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zaheri-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: RECEIPT_SIGNING_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://zaheri-web.onrender.com
      - key: NODE_ENV
        value: production

  - type: web
    name: zaheri-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @zaheri/web... run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://zaheri-api.onrender.com
      # Root package.json pins packageManager to pnpm@11.24.0, which
      # requires Node >=22.13 — Render's static-site build environment
      # needs this spelled out explicitly rather than assumed.
      - key: NODE_VERSION
        value: 22.13.0
    routes:
      # SPA client-side routing — unmatched paths (e.g. /console/cases/123
      # on a hard refresh) must serve index.html, not 404.
      - source: /*
        destination: /index.html
